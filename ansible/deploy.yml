- name: Deploy Flask Application to Kubernetes
  hosts: localhost
  tasks:
    - name: Create or Update Deployment
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: flask-app
            namespace: flask-prod
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: flask
            template:
              metadata:
                labels:
                  app: flask
              spec:
                containers:
                - name: flask-container
                  image: "{{ docker_image }}"
                  ports:
                  - containerPort: 5000
                  imagePullPolicy: Always