apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: flask-app-monitor
  namespace: monitoring
  labels:
    release: monitoring-stack
spec:
  # AJOUT IMPORTANT : Dire à Prometheus de regarder dans le namespace de l'app
  namespaceSelector:
    matchNames:
      - flask-prod
  selector:
    matchLabels:
      app: flask
  endpoints:
  - port: http
    path: /metrics
    interval: 15s